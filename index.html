<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مصطفى جيمرز</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
}

:root{
--cyan:#00eaff;
--purple:#a855f7;
--line:rgba(255,255,255,.08);
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:'Cairo',sans-serif;
color:#fff;

background:
radial-gradient(circle at 15% 10%,rgba(0,234,255,.10),transparent 28%),
radial-gradient(circle at 85% 20%,rgba(168,85,247,.13),transparent 30%),
linear-gradient(145deg,#050509,#0c0b16 48%,#06060a);

min-height:100vh;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:.20;

background-image:
linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);

background-size:42px 42px;
}


/* =========================
   HEADER
========================= */

header{
position:sticky;
top:0;
z-index:999;

padding:12px 18px;

background:rgba(6,6,12,.78);
backdrop-filter:blur(18px);

border-bottom:1px solid var(--line);

box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.nav{
max-width:1280px;
margin:auto;

display:flex;
align-items:center;
justify-content:center;
gap:15px;
}

.logo{
width:43px;
height:43px;

border-radius:13px;

display:grid;
place-items:center;

background:
linear-gradient(135deg,var(--cyan),var(--purple));

box-shadow:
0 0 22px rgba(0,234,255,.30);

font-size:21px;
}

header h1{
margin:0;
font-size:22px;
font-weight:900;

background:
linear-gradient(90deg,#fff,var(--cyan),#d26bff);

-webkit-background-clip:text;
background-clip:text;

color:transparent;
}


/* =========================
   SEARCH
========================= */

.search-box{
max-width:1280px;
margin:18px auto 5px;
padding:0 20px;
}

.search-wrap{
position:relative;
}

.search-wrap i{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
color:#777;
}

#searchInput{
width:100%;

padding:13px 45px 13px 15px;

border-radius:13px;

border:1px solid var(--line);

outline:none;

background:rgba(13,13,23,.90);

color:#fff;

font-family:'Cairo',sans-serif;

transition:.25s;
}

#searchInput:focus{
border-color:var(--cyan);

box-shadow:
0 0 20px rgba(0,234,255,.12);
}


/* =========================
   GAMES
========================= */

.games-container{
max-width:1280px;
margin:auto;

padding:18px 20px 40px;

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:15px;
}


/* =========================
   CARD
========================= */

.game-card{

background:
linear-gradient(
160deg,
rgba(20,20,33,.94),
rgba(10,10,17,.97)
);

border:1px solid var(--line);

border-radius:18px;

padding:10px;

position:relative;

overflow:hidden;

box-shadow:
0 10px 30px rgba(0,0,0,.25);

transition:.3s;

animation:cardIn .55s both;
}

@keyframes cardIn{

from{
opacity:0;
transform:translateY(18px);
}

to{
opacity:1;
transform:none;
}

}

.game-card:hover{

transform:translateY(-5px);

border-color:
rgba(0,234,255,.30);

box-shadow:
0 18px 40px rgba(0,0,0,.40),
0 0 25px rgba(0,234,255,.08);
}

.game-card.hidden{
display:none!important;
}


/* =========================
   IMAGE
========================= */

.img-container{

width:100%;
height:165px;

border-radius:12px;

overflow:hidden;

margin-bottom:11px;

border:1px solid rgba(255,255,255,.07);

transition:.3s;
}

.img-container img{

width:100%;
height:100%;

object-fit:cover;

display:block;

transition:.4s;
}

.game-card:hover img{

transform:scale(1.06);

filter:brightness(1.08);
}

.game-card:hover .img-container{

border-color:
rgba(0,234,255,.45);

box-shadow:
0 0 20px rgba(0,234,255,.12);
}


/* =========================
   TITLE
========================= */

.game-card h2{

margin:11px 3px 12px;

font-size:15px;

font-weight:900;

color:#fff;

text-align:right;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}


/* =========================
   BUTTON
========================= */

.card-actions{

display:flex;

gap:8px;

align-items:center;

justify-content:center;

margin-top:8px;
}

.download-btn{

position:relative;

overflow:hidden;

display:block;

flex:1;

padding:10px 12px;

border-radius:11px;

text-align:center;

text-decoration:none;

font-family:'Cairo',sans-serif;

font-size:13px;

font-weight:900;

color:#061016;

background:
linear-gradient(
135deg,
var(--cyan),
#765cff
);

box-shadow:
0 7px 20px rgba(0,234,255,.13);

transition:.25s;

cursor:pointer;
}

.download-btn::after{

content:"";

position:absolute;

top:0;
left:-80%;

width:45%;
height:100%;

background:rgba(255,255,255,.25);

transform:skewX(-25deg);

animation:shine 3s infinite;
}

@keyframes shine{

0%{
left:-80%;
}

50%{
left:130%;
}

100%{
left:130%;
}

}

.download-btn:hover{

transform:translateY(-2px);

box-shadow:
0 10px 25px rgba(0,234,255,.25);
}


/* =========================
   COUNTDOWN
========================= */

.download-btn.counting{

background:#151520!important;

color:var(--cyan)!important;

border:1px solid var(--cyan);

animation:pulse 1.3s infinite;

pointer-events:none;
}

@keyframes pulse{

50%{
box-shadow:
0 0 20px rgba(0,234,255,.35);
}

}


/* =========================
   TOAST
========================= */

#toast-container{

position:fixed;

bottom:22px;
right:20px;

z-index:10000;

display:flex;

flex-direction:column;

gap:9px;

pointer-events:none;
}

.toast-notification{

min-width:250px;
max-width:350px;

padding:12px 16px;

border-radius:13px;

background:rgba(14,14,24,.95);

border:1px solid var(--cyan);

box-shadow:
0 12px 35px rgba(0,0,0,.40);

backdrop-filter:blur(14px);

font-size:13px;

font-weight:700;

transform:translateX(120%);

opacity:0;

transition:.35s;
}

.toast-notification.show{

transform:translateX(0);

opacity:1;
}


/* =========================
   TELEGRAM
========================= */

.telegram-float{

position:fixed;

bottom:20px;
left:20px;

z-index:1000;

width:50px;
height:50px;

border-radius:50%;

display:grid;
place-items:center;

background:#151522;

border:1px solid var(--cyan);

box-shadow:
0 0 20px rgba(0,234,255,.25);

transition:.25s;
}

.telegram-float:hover{

transform:
translateY(-4px)
scale(1.05);

box-shadow:
0 0 28px rgba(0,234,255,.45);
}

.telegram-float img{

width:34px;
height:34px;
}


/* =========================
   FOOTER
========================= */

footer{

margin-top:20px;

padding:38px 20px;

text-align:center;

background:#06060c;

border-top:
1px solid rgba(0,234,255,.15);

box-shadow:
0 -10px 35px rgba(0,0,0,.25);
}

.footer-content{

max-width:600px;

margin:auto;

display:flex;

flex-direction:column;

align-items:center;

gap:15px;
}

.footer-title{

margin:0;

font-size:22px;

font-weight:900;

background:
linear-gradient(
90deg,
#fff,
var(--cyan),
#d26bff
);

-webkit-background-clip:text;
background-clip:text;

color:transparent;
}

.social-links{

display:flex;

gap:12px;
}

.social-icon{

width:45px;
height:45px;

border-radius:13px;

display:grid;
place-items:center;

background:
rgba(255,255,255,.04);

border:1px solid var(--line);

color:#fff;

text-decoration:none;

font-size:19px;

transition:.25s;
}

.social-icon:hover{

transform:translateY(-3px);

border-color:var(--cyan);

box-shadow:
0 0 18px rgba(0,234,255,.18);
}

.footer-rights{

margin:0;

color:#5f6170;

font-size:12px;
}


/* =========================
   NO RESULTS
========================= */

.no-results{

display:none;

grid-column:1/-1;

text-align:center;

padding:50px 20px;

color:#777;

font-size:16px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

.games-container{
grid-template-columns:
repeat(3,1fr);
}

}

@media(max-width:700px){

header{
padding:10px 12px;
}

header h1{
font-size:19px;
}

.logo{
width:40px;
height:40px;
}

.search-box{
padding:0 12px;
margin-top:13px;
}

.games-container{

grid-template-columns:
repeat(2,1fr);

gap:9px;

padding:12px;
}

.game-card{

padding:8px;

border-radius:14px;
}

.img-container{

height:130px;

border-radius:10px;
}

.game-card h2{
font-size:13px;
}

.download-btn{

font-size:12px;

padding:9px 7px;
}

.telegram-float{

width:46px;
height:46px;

bottom:15px;
left:15px;
}

}

@media(max-width:390px){

.img-container{
height:112px;
}

.game-card h2{
font-size:12px;
}

}

</style>

</head>


<body>


<div id="toast-container"></div>


<!-- HEADER -->

<header>

<div class="nav">

<div class="logo">

<i class="fa-solid fa-gamepad"></i>

</div>

<h1>مصطفى جيمرز</h1>

</div>

</header>


<!-- SEARCH -->

<div class="search-box">

<div class="search-wrap">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="searchInput"
type="text"
placeholder="ابحث عن لعبة..."
autocomplete="off"
>

</div>

</div>


<!-- GAMES -->

<main class="games-container">


<!-- UNCHARTED -->

<div class="game-card">

<div class="img-container">

<img
src="images/unc.jpg"
alt="uncharted"
>

</div>

<h2>Uncharted Golden Abyss</h2>

<div class="card-actions">

<a
class="download-btn"
href="https://modsfire.com/coT21D3m594vp0w"
onclick="startDownload(event,this)"
>
تحميل
</a>

</div>

</div>


<!-- MORTAL KOMBAT 9 -->

<div class="game-card">

<div class="img-container">

<img
src="images/mkk9.jpg"
alt="mkk9"
>

</div>

<h2>MORTAL KOMBAT 9</h2>

<div class="card-actions">

<a
class="download-btn"
href="https://modsfire.com/RS37N00Q24vkhJb"
onclick="startDownload(event,this)"
>
تحميل
</a>

</div>

</div>


<!-- GOD OF WAR COLLECTION -->

<div class="game-card">

<div class="img-container">

<img
src="images/gowce.jpg"
alt="god of war collection"
>

</div>

<h2>GOD OF WAR COLLECTION</h2>

<div class="card-actions">

<a
class="download-btn"
href="https://modsfire.com/mI7VBzsdc4E31Qz"
onclick="startDownload(event,this)"
>
تحميل
</a>

</div>

</div>


<!-- THE AMAZING SPIDER MAN -->

<div class="game-card">

<div class="img-container">

<img
src="images/spmm.jpg"
alt="spmm"
>

</div>

<h2>THE AMAZING SPIDER MAN</h2>

<div class="card-actions">

<a
class="download-btn"
href="https://modsfire.com/A506QIhVbWq23AZ"
onclick="startDownload(event,this)"
>
تحميل
</a>

</div>

</div>


<!-- NO RESULTS -->

<div
class="no-results"
id="noResults"
>

<i
class="fa-solid fa-gamepad"
style="
font-size:40px;
margin-bottom:10px;
color:#00eaff;
"
></i>

<br>

لم يتم العثور على اللعبة

</div>


</main>


<!-- TELEGRAM -->

<a
href="https://t.me/mustafaGWZ"
target="_blank"
class="telegram-float"
title="تابعني على التليجرام"
>

<img
src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg"
alt="Telegram"
>

</a>


<!-- FOOTER -->

<footer>

<div class="footer-content">

<p class="footer-title">
مصطفى جيمرز
</p>

<div class="social-links">

<a
href="https://t.me/mustafaGWZ"
target="_blank"
class="social-icon"
>

<i class="fab fa-telegram-plane"></i>

</a>

</div>

<p class="footer-rights">
جميع الحقوق محفوظة © 2026
</p>

</div>

</footer>


<script>


/* =========================
   SEARCH
========================= */

const searchInput =
document.getElementById(
"searchInput"
);

const noResults =
document.getElementById(
"noResults"
);


searchInput.addEventListener(
"input",
function(){

const query =
this.value
.toLowerCase()
.trim();

let visible=0;


document
.querySelectorAll(
".game-card"
)
.forEach(card=>{

const title =
card
.querySelector("h2")
.textContent
.toLowerCase();


if(title.includes(query)){

card.classList.remove(
"hidden"
);

visible++;

}else{

card.classList.add(
"hidden"
);

}

});


if(visible===0){

noResults.style.display=
"block";

}else{

noResults.style.display=
"none";

}

});


/* =========================
   TOAST
========================= */

function showToast(message){

const container =
document.getElementById(
"toast-container"
);

const toast =
document.createElement(
"div"
);

toast.className =
"toast-notification";

toast.innerHTML =
message;

container.appendChild(
toast
);


setTimeout(()=>{

toast.classList.add(
"show"
);

},50);


setTimeout(()=>{

toast.classList.remove(
"show"
);

setTimeout(()=>{

toast.remove();

},400);

},3000);

}


/* =========================
   DOWNLOAD
========================= */

function startDownload(
event,
element
){

event.preventDefault();


if(
element.classList.contains(
"counting"
)
)return;


const targetUrl =
element.getAttribute(
"href"
);


const card =
element.closest(
".game-card"
);


const gameTitle =
card
.querySelector("h2")
.textContent
.trim();


let timeLeft=3;


element.classList.add(
"counting"
);


element.textContent =
`تجهيز.. (${timeLeft})`;


showToast(

`🛡️ جاري تجهيز رابط التحميل:
<br>

<span style="color:#00eaff">

${gameTitle}

</span>`

);


const countdown =
setInterval(()=>{

timeLeft--;


if(timeLeft<=0){

clearInterval(
countdown
);


element.classList.remove(
"counting"
);


element.textContent=
"تحميل";


window.open(
targetUrl,
"_blank"
);

}else{

element.textContent =
`تجهيز.. (${timeLeft})`;

}

},1000);

}

</script>


</body>

</html>
